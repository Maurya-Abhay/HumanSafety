name: HumanSafety
description: Next-generation emergency safety system app.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  
  # API & NETWORKING
  http: ^1.1.0
  dio: ^5.3.0
  
  # CACHING & PERFORMANCE
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.3.0
  
  # CONFIGURATION
  flutter_dotenv: ^5.1.0
  
  # STATE MANAGEMENT
  provider: ^6.0.0
  get_it: ^7.7.0
  
  # DEVICE FEATURES (ESSENTIAL ONLY)
  geolocator: ^10.1.0
  sensors_plus: ^1.4.1
  
  # LOCAL STORAGE
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  
  # UI UTILITIES
  intl: ^0.19.0
  
  # CONNECTIVITY & AUDIO
  web_socket_channel: ^2.4.0
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1
  battery_plus: ^6.0.0
  url_launcher: ^6.3.0
  noise_meter: ^5.0.2
  
  # NOTIFICATIONS (Local only - no Firebase)
  flutter_local_notifications: ^21.0.0
  
  # DATABASE
  sqflite: ^2.3.0
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/HumanSafetyLogo.png
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/HumanSafetyLogo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/HumanSafetyLogo.png"