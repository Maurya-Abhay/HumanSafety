name: human_safety
description: Next-generation emergency safety system app.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  
  # ============== API & NETWORKING ==============
  http: ^1.1.0
  dio: ^5.3.0
  
  # ============== STATE MANAGEMENT ==============
  provider: ^6.0.0
  get_it: ^7.6.0
  
  # ============== DEVICE FEATURES ==============
  geolocator: ^9.0.0
  sensors_plus: ^1.4.0
  
  # ============== LOCAL STORAGE ==============
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  
  # ============== UI UTILITIES ==============
  intl: ^0.19.0
  google_maps_flutter: ^2.5.0
  
  # ============== CONNECTIVITY ==============
  connectivity_plus: ^5.0.0
  web_socket_channel: ^2.4.0
  
  # ============== PUSH NOTIFICATIONS ==============
  # firebase_core: ^2.24.0
  # firebase_messaging: ^14.7.0
  
  # ============== PERFORMANCE ==============
  sqflite: ^2.3.0
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
